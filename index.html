<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Match the Character</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#8bd8ff;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  min-height:560px;
  overflow:hidden;
  background:linear-gradient(
    #75d7ff 0 38%,
    #9bdc67 38% 52%,
    #2ebce8 52% 100%
  );
}

/* SKY */

.sky{
  position:absolute;
  inset:0 0 48% 0;
  background:linear-gradient(#6ed5ff,#c7f4ff);
}

.sun{
  position:absolute;
  right:7%;
  top:5%;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#ffd84d;
  box-shadow:0 0 0 10px rgba(255,216,77,.2);
}

.cloud{
  position:absolute;
  width:110px;
  height:35px;
  background:white;
  border-radius:40px;
  opacity:.92;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:48px;
  height:48px;
  left:18px;
  top:-23px;
}

.cloud:after{
  width:58px;
  height:58px;
  right:13px;
  top:-31px;
}

.c1{
  top:10%;
  left:8%;
}

.c2{
  top:18%;
  right:20%;
  transform:scale(.8);
}

/* BACKGROUND */

.hill{
  position:absolute;
  left:-5%;
  right:-5%;
  top:30%;
  height:28%;
  background:#56b94f;
  border-radius:50% 50% 0 0/55% 55% 0 0;
}

.hill:after{
  content:"";
  position:absolute;
  right:-15%;
  top:20%;
  width:70%;
  height:100%;
  background:#3da947;
  border-radius:50% 50% 0 0;
}

.bank{
  position:absolute;
  left:0;
  right:0;
  top:43%;
  height:12%;
  background:#e8bd6b;
  border-bottom:9px solid #d99d50;
}

/* RIVER */

.river{
  position:absolute;
  left:0;
  right:0;
  top:54%;
  bottom:0;
  background:linear-gradient(180deg,#37c8ee,#159fd8);
}

.river:before,
.river:after{
  content:"";
  position:absolute;
  left:-10%;
  width:120%;
  height:18px;
  border-radius:50%;
  border-top:4px solid rgba(255,255,255,.55);
}

.river:before{
  top:22%;
}

.river:after{
  top:65%;
}

/* TITLE */

.title{
  position:absolute;
  z-index:20;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  padding:9px 18px;
  border-radius:18px;
  background:rgba(255,255,255,.92);
  font-size:clamp(19px,4vw,28px);
  font-weight:900;
  color:#155a85;
  box-shadow:0 5px 0 rgba(0,0,0,.12);
  white-space:nowrap;
}

.score{
  position:absolute;
  z-index:20;
  top:70px;
  right:15px;
  background:#fff;
  padding:9px 12px;
  border-radius:16px;
  font-weight:900;
  color:#21854e;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}

/* BUCKETS */

.buckets{
  position:absolute;
  z-index:10;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(94%,680px);

  display:flex;
  justify-content:space-around;
  gap:12px;
}

.bucket{
  position:relative;

  width:clamp(92px,25vw,155px);
  height:clamp(105px,22vw,145px);

  border-radius:14px 14px 32px 32px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(48px,11vw,78px);
  font-weight:1000;

  color:white;

  text-shadow:0 4px 0 rgba(0,0,0,.18);

  box-shadow:
    inset 0 -12px 0 rgba(0,0,0,.13),
    0 7px 0 rgba(0,0,0,.16);
}

.bucket:before{
  content:"";
  position:absolute;

  left:-5%;
  top:-9px;

  width:110%;
  height:22px;

  border-radius:50%;

  background:rgba(255,255,255,.35);

  border:5px solid rgba(0,0,0,.12);
}

.bucket:nth-child(1){
  background:#ef4d55;
}

.bucket:nth-child(2){
  background:#3e83f1;
}

.bucket:nth-child(3){
  background:#a64ee7;
}

/* DRAG LETTER */

.char{
  position:absolute;
  z-index:30;

  width:clamp(64px,15vw,88px);
  height:clamp(64px,15vw,88px);

  border-radius:22px;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(38px,9vw,58px);
  font-weight:1000;

  color:#244b6b;

  box-shadow:0 7px 0 rgba(0,0,0,.16);

  border:4px solid #dff7ff;

  cursor:grab;

  user-select:none;

  touch-action:none;

  transition:
    transform .12s,
    opacity .25s;
}

.char.dragging{
  cursor:grabbing;

  transform:
    scale(1.12)
    rotate(-4deg);

  box-shadow:
    0 13px 18px rgba(0,0,0,.2);
}

.char.correct{
  transform:scale(.2);
  opacity:0;
}

.char.wrong{
  animation:shake .28s;
}

@keyframes shake{

  25%{
    transform:translateX(-9px);
  }

  50%{
    transform:translateX(9px);
  }

  75%{
    transform:translateX(-7px);
  }
}

/* CORRECT MESSAGE */

#message{
  position:absolute;

  z-index:50;

  left:50%;
  top:57%;

  transform:
    translate(-50%,-50%)
    scale(0);

  background:white;

  padding:16px 26px;

  border-radius:22px;

  font-size:clamp(25px,7vw,42px);

  font-weight:1000;

  color:#1d9b55;

  box-shadow:
    0 9px 25px rgba(0,0,0,.2);

  transition:.2s;

  pointer-events:none;
}

#message.show{

  transform:
    translate(-50%,-50%)
    scale(1);
}

/* FINISH */

#finish{

  display:none;

  position:absolute;

  z-index:100;

  inset:0;

  background:
    rgba(16,61,86,.38);

  align-items:center;

  justify-content:center;

  padding:22px;
}

.card{

  width:min(90%,420px);

  background:#fff;

  border-radius:30px;

  padding:28px;

  text-align:center;

  box-shadow:
    0 18px 40px rgba(0,0,0,.25);
}

.card h2{

  margin:0 0 8px;

  font-size:34px;

  color:#2b79d0;
}

.card p{

  font-size:20px;

  color:#456;

  margin:8px 0 22px;
}

.card button{

  border:0;

  border-radius:18px;

  background:#42bd68;

  color:#fff;

  font-size:20px;

  font-weight:900;

  padding:14px 28px;

  box-shadow:
    0 6px 0 #278b48;

  cursor:pointer;
}

.hint{

  position:absolute;

  z-index:15;

  bottom:13px;

  left:50%;

  transform:translateX(-50%);

  background:
    rgba(255,255,255,.85);

  padding:8px 14px;

  border-radius:15px;

  font-weight:700;

  color:#176587;

  font-size:14px;

  white-space:nowrap;
}

@media(max-height:650px){

  .title{
    top:7px;
  }

  .score{
    top:60px;
  }

  .buckets{
    top:39%;
  }

  .bucket{
    height:95px;
  }

  .hint{
    display:none;
  }
}
</style>
</head>


<body>

<div id="game">

<div class="sky"></div>

<div class="sun"></div>

<div class="cloud c1"></div>

<div class="cloud c2"></div>

<div class="hill"></div>

<div class="bank"></div>

<div class="river"></div>


<div class="title">
🌟 Match the Character
</div>


<div class="score">

⭐

<span id="score">
0
</span>

/

<span id="total">
9
</span>

</div>


<!-- BUCKETS -->

<div class="buckets">

<div
class="bucket"
data-letter="A">

A

</div>


<div
class="bucket"
data-letter="B">

B

</div>


<div
class="bucket"
data-letter="C">

C

</div>

</div>


<div id="message">

Great! 🎉

</div>


<div class="hint">

Drag each letter into the matching bucket 👆

</div>


<!-- FINISH POPUP -->

<div id="finish">

<div class="card">

<div style="font-size:64px">

🏆

</div>

<h2>

Well Done!

</h2>

<p>

You matched all the characters!

</p>

<button onclick="startGame()">

Play Again

</button>

</div>

</div>

</div>


<script>

const game =
document.getElementById('game');

const scoreEl =
document.getElementById('score');

const totalEl =
document.getElementById('total');

const message =
document.getElementById('message');

const finish =
document.getElementById('finish');


let score = 0;

let dragging = null;

let offsetX = 0;

let offsetY = 0;

let startX = 0;

let startY = 0;


/* =========================
   LETTERS USED IN GAME
========================= */

const letters = [

'A',
'B',
'C',

'A',
'C',
'B',

'B',
'A',
'C'

];


/* =========================
   SOUND
========================= */

function beep(ok=true){

try{

const ac =
new (
window.AudioContext ||
window.webkitAudioContext
)();

const o =
ac.createOscillator();

const g =
ac.createGain();

o.connect(g);

g.connect(ac.destination);

o.frequency.value =
ok ? 660 : 180;

g.gain.value = .08;

o.start();

o.frequency
.exponentialRampToValueAtTime(

ok ? 880 : 130,

ac.currentTime + .13

);

g.gain
.exponentialRampToValueAtTime(

.001,

ac.currentTime + .18

);

o.stop(
ac.currentTime + .19
);

}

catch(e){}

}


/* =========================
   START GAME
========================= */

function startGame(){

document
.querySelectorAll('.char')
.forEach(x => x.remove());


finish.style.display =
'none';


score = 0;

scoreEl.textContent = 0;

totalEl.textContent =
letters.length;


/* RANDOM LETTER ORDER */

const shuffled =

[...letters]
.sort(
() => Math.random() - .5
);


const W =
game.clientWidth;

const H =
game.clientHeight;


const size =

Math.min(

88,

Math.max(
64,
W * .15
)

);


const riverTop =
H * .56;

const bottom =
H - 95;


const cols =

Math.max(

3,

Math.floor(
W / (size + 18)
)

);


shuffled.forEach(

(letter,i) => {

const el =
document.createElement('div');


el.className =
'char';


el.textContent =
letter;


el.dataset.letter =
letter;


const col =
i % cols;


const row =
Math.floor(
i / cols
);


const usableW =
W - 30 - size;


const gap =

usableW /

Math.max(
1,
cols - 1
);


let x =

15 +

col * gap +

(
Math.random() * 10 - 5
);


let y =

riverTop +

20 +

row * (size + 18) +

(
Math.random() * 8 - 4
);


if(
y > bottom - size
){

y =

riverTop +

20 +

(i % 2) *
(size + 14);

}


el.style.left =
x + 'px';


el.style.top =
y + 'px';


el.addEventListener(

'pointerdown',

grab

);


game.appendChild(el);

});

}


/* =========================
   START DRAG
========================= */

function grab(e){

e.preventDefault();


dragging =
e.currentTarget;


dragging
.setPointerCapture(
e.pointerId
);


const r =
dragging
.getBoundingClientRect();


const gr =
game
.getBoundingClientRect();


offsetX =
e.clientX - r.left;


offsetY =
e.clientY - r.top;


startX =
r.left - gr.left;


startY =
r.top - gr.top;


dragging
.classList
.add('dragging');


dragging
.addEventListener(
'pointermove',
move
);


dragging
.addEventListener(
'pointerup',
drop
);


dragging
.addEventListener(
'pointercancel',
drop
);

}


/* =========================
   MOVE LETTER WITH FINGER
========================= */

function move(e){

if(!dragging)
return;


const gr =
game
.getBoundingClientRect();


const w =
dragging.offsetWidth;


const h =
dragging.offsetHeight;


let x =

e.clientX -

gr.left -

offsetX;


let y =

e.clientY -

gr.top -

offsetY;


x =

Math.max(

0,

Math.min(

gr.width - w,

x

)

);


y =

Math.max(

0,

Math.min(

gr.height - h,

y

)

);


dragging.style.left =
x + 'px';


dragging.style.top =
y + 'px';

}


/* =========================
   DROP LETTER
========================= */

function drop(e){

if(!dragging)
return;


const item =
dragging;


const ir =
item
.getBoundingClientRect();


const cx =
ir.left +
ir.width / 2;


const cy =
ir.top +
ir.height / 2;


/* CHECK WHICH BUCKET */

const bucket =

[
...document
.querySelectorAll('.bucket')
]

.find(

b => {

const r =
b.getBoundingClientRect();


return (

cx >= r.left &&

cx <= r.right &&

cy >= r.top &&

cy <= r.bottom

);

});


item
.classList
.remove('dragging');


item
.removeEventListener(
'pointermove',
move
);


item
.removeEventListener(
'pointerup',
drop
);


item
.removeEventListener(
'pointercancel',
drop
);


/* CORRECT */

if(

bucket &&

bucket.dataset.letter ===
item.dataset.letter

){

beep(true);


score++;


scoreEl.textContent =
score;


item
.classList
.add('correct');


message.textContent =
'Great! 🎉';


message
.classList
.add('show');


setTimeout(

() =>
message
.classList
.remove('show'),

500

);


setTimeout(

() =>
item.remove(),

260

);


/* FINISHED */

if(
score === letters.length
){

setTimeout(

() =>

finish.style.display =
'flex',

650

);

}

}


/* WRONG */

else{

beep(false);


item
.classList
.add('wrong');


item.style.left =
startX + 'px';


item.style.top =
startY + 'px';


setTimeout(

() =>
item
.classList
.remove('wrong'),

320

);

}


dragging = null;

}


/* START */

startGame();

</script>

</body>
</html>
