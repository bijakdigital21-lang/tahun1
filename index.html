<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Match the Character</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    touch-action:none;
}

body{
    background:#78c957;
}

/* ==============================
   MAIN GAME
============================== */

#game{
    position:relative;
    width:100%;
    height:100%;
    min-height:600px;
    overflow:hidden;

    background:
    radial-gradient(circle at 10% 15%, #8adb63 0 4%, transparent 4.5%),
    radial-gradient(circle at 90% 30%, #73c653 0 5%, transparent 5.5%),
    linear-gradient(
        90deg,
        #78c957 0%,
        #82d35e 25%,
        #76c653 50%,
        #82d35e 75%,
        #78c957 100%
    );
}

/* ==============================
   GAME TITLE
============================== */

.game-title{
    position:absolute;

    z-index:100;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    background:#fff;

    padding:10px 20px;

    border-radius:20px;

    font-size:clamp(19px,5vw,28px);

    font-weight:900;

    color:#2473a6;

    box-shadow:
    0 5px 0 rgba(0,0,0,.13);

    white-space:nowrap;
}

/* ==============================
   SCORE
============================== */

.score-box{
    position:absolute;

    z-index:100;

    top:72px;
    right:15px;

    background:#fff;

    padding:8px 13px;

    border-radius:16px;

    font-size:16px;

    font-weight:900;

    color:#29884b;

    box-shadow:
    0 4px 0 rgba(0,0,0,.12);
}

/* ==============================
   RIVER

   Sungai dibuat menggunakan
   bentuk besar yang melengkung.
============================== */

.river{
    position:absolute;

    z-index:2;

    top:-10%;

    left:24%;

    width:55%;

    height:125%;

    background:
    linear-gradient(
        90deg,
        #25b4e4,
        #55d5f2 35%,
        #35c2ec 65%,
        #169ed5
    );

    transform:
    rotate(-4deg);

    border-radius:
    45% 55% 40% 60% /
    10% 15% 12% 10%;

    box-shadow:
    inset 18px 0 25px rgba(255,255,255,.14),
    inset -15px 0 20px rgba(0,96,160,.12);
}

/* irregular left river bank */

.river-left-bank{

    position:absolute;

    z-index:3;

    top:-5%;

    left:16%;

    width:18%;

    height:115%;

    background:#d8b76e;

    transform:rotate(-4deg);

    border-radius:
    30% 60% 40% 70% /
    10% 20% 12% 15%;
}

/* grass over left bank */

.river-left-grass{

    position:absolute;

    z-index:4;

    top:-5%;

    left:10%;

    width:17%;

    height:115%;

    background:
    linear-gradient(
        90deg,
        #5eae3e,
        #78c957
    );

    transform:rotate(-4deg);

    border-radius:
    30% 65% 35% 70% /
    10% 15% 12% 15%;
}


/* right river bank */

.river-right-bank{

    position:absolute;

    z-index:3;

    top:-5%;

    right:13%;

    width:19%;

    height:115%;

    background:#d8b76e;

    transform:rotate(-4deg);

    border-radius:
    60% 30% 70% 35% /
    15% 10% 15% 12%;
}


/* grass over right bank */

.river-right-grass{

    position:absolute;

    z-index:4;

    top:-5%;

    right:7%;

    width:16%;

    height:115%;

    background:
    linear-gradient(
        90deg,
        #78c957,
        #5eae3e
    );

    transform:rotate(-4deg);

    border-radius:
    60% 35% 70% 40% /
    15% 10% 15% 12%;
}


/* ==============================
   WATER WAVES
============================== */

.wave{

    position:absolute;

    z-index:5;

    width:55px;

    height:12px;

    border-radius:50%;

    border-top:
    4px solid rgba(255,255,255,.55);

    pointer-events:none;
}

.wave1{
    left:42%;
    top:30%;
}

.wave2{
    left:54%;
    top:45%;
}

.wave3{
    left:36%;
    top:62%;
}

.wave4{
    left:57%;
    top:76%;
}

.wave5{
    left:42%;
    top:88%;
}


/* ==============================
   ROCKS
============================== */

.rock{

    position:absolute;

    z-index:7;

    width:42px;
    height:30px;

    background:#9b9b8c;

    border-radius:
    60% 40% 55% 45%;

    box-shadow:
    inset -7px -5px 0 rgba(0,0,0,.12);

}

.rock1{
    left:16%;
    top:27%;
}

.rock2{
    right:11%;
    top:52%;
}

.rock3{
    left:15%;
    top:78%;
}

.rock4{
    right:13%;
    top:86%;
}


/* ==============================
   BUSH / TREE
============================== */

.bush{

    position:absolute;

    z-index:8;

    width:75px;
    height:55px;

    background:#338c3d;

    border-radius:50%;
}

.bush:before,
.bush:after{

    content:"";

    position:absolute;

    background:#42a84b;

    border-radius:50%;
}

.bush:before{

    width:55px;
    height:55px;

    left:-22px;
    top:10px;
}

.bush:after{

    width:55px;
    height:55px;

    right:-20px;
    top:7px;
}

.bush1{
    left:4%;
    top:18%;
}

.bush2{
    right:2%;
    top:65%;
}

.bush3{
    left:3%;
    top:87%;
}


/* ==============================
   FLOWERS
============================== */

.flower{

    position:absolute;

    z-index:9;

    font-size:25px;

    pointer-events:none;
}

.flower1{
    left:7%;
    top:45%;
}

.flower2{
    right:6%;
    top:35%;
}

.flower3{
    right:9%;
    top:80%;
}


/* ==============================
   BUCKET AREA
============================== */

.bucket-area{

    position:absolute;

    z-index:30;

    top:13%;

    left:50%;

    transform:translateX(-50%);

    width:95%;

    max-width:620px;

    display:flex;

    justify-content:space-around;

    align-items:flex-end;

    gap:8px;
}


/* ==============================
   REAL BUCKET SHAPE
============================== */

.bucket{

    position:relative;

    width:clamp(90px,27vw,145px);

    height:clamp(90px,27vw,135px);

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff;

    font-size:clamp(45px,12vw,70px);

    font-weight:1000;

    text-shadow:
    0 4px 0 rgba(0,0,0,.16);

    /* bucket gets narrower at bottom */

    clip-path:
    polygon(
        8% 8%,
        92% 8%,
        80% 100%,
        20% 100%
    );

    border-radius:10px;

    box-shadow:
    inset 0 -13px 0 rgba(0,0,0,.12),
    inset 8px 0 10px rgba(255,255,255,.15);

}


/* BUCKET TOP RIM */

.bucket-rim{

    position:absolute;

    z-index:5;

    top:-4px;

    left:4%;

    width:92%;

    height:20px;

    border-radius:50%;

    background:rgba(255,255,255,.45);

    border:4px solid rgba(0,0,0,.15);

    pointer-events:none;
}


/* BUCKET HANDLE */

.bucket-handle{

    position:absolute;

    z-index:-1;

    width:80%;

    height:65%;

    top:-25%;

    left:10%;

    border:

    6px solid #555;

    border-bottom:0;

    border-radius:

    50% 50% 0 0;

    pointer-events:none;
}


.bucket-red{
    background:
    linear-gradient(
        90deg,
        #df3f48,
        #ff6268,
        #d83540
    );
}


.bucket-blue{
    background:
    linear-gradient(
        90deg,
        #2675db,
        #4d9aff,
        #236bc9
    );
}


.bucket-purple{
    background:
    linear-gradient(
        90deg,
        #9144cf,
        #bd66ef,
        #8739c5
    );
}


/* ==============================
   LETTERS IN WATER

   NO BOX
============================== */

.character{

    position:absolute;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    width:60px;
    height:65px;

    font-size:
    clamp(42px,13vw,67px);

    font-weight:1000;

    color:#fff;

    text-shadow:

    0 4px 0 rgba(0,78,130,.35),

    2px 2px 0 rgba(0,0,0,.12);

    cursor:grab;

    user-select:none;

    touch-action:none;

    transition:
    transform .15s,
    opacity .25s;

    animation:
    floatLetter 2.2s
    ease-in-out
    infinite;
}


@keyframes floatLetter{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }

}


.character.dragging{

    animation:none;

    transform:
    scale(1.25);

    cursor:grabbing;

    text-shadow:

    0 8px 10px rgba(0,0,0,.22);
}


.character.correct{

    animation:none;

    transform:
    scale(.1);

    opacity:0;
}


.character.wrong{

    animation:
    wrongShake .3s;
}


@keyframes wrongShake{

    25%{
        transform:translateX(-10px);
    }

    50%{
        transform:translateX(10px);
    }

    75%{
        transform:translateX(-7px);
    }

}


/* ==============================
   CORRECT POPUP
============================== */

#correctMessage{

    position:absolute;

    z-index:200;

    left:50%;

    top:52%;

    transform:
    translate(-50%,-50%)
    scale(0);

    background:#fff;

    padding:
    15px 27px;

    border-radius:25px;

    font-size:
    clamp(26px,8vw,43px);

    font-weight:1000;

    color:#28a65d;

    box-shadow:
    0 10px 30px rgba(0,0,0,.2);

    transition:.2s;

    pointer-events:none;
}


#correctMessage.show{

    transform:
    translate(-50%,-50%)
    scale(1);
}


/* ==============================
   FINISH POPUP
============================== */

#finish{

    display:none;

    position:absolute;

    z-index:300;

    inset:0;

    background:
    rgba(0,55,85,.45);

    align-items:center;

    justify-content:center;

    padding:20px;
}


.finish-card{

    width:min(90%,400px);

    background:#fff;

    padding:30px 22px;

    border-radius:30px;

    text-align:center;

    box-shadow:
    0 20px 45px rgba(0,0,0,.28);
}


.finish-card h2{

    margin:
    5px 0 10px;

    color:#257bc2;

    font-size:34px;
}


.finish-card p{

    color:#526774;

    font-size:18px;

}


.finish-card button{

    border:0;

    margin-top:12px;

    padding:
    14px 30px;

    border-radius:18px;

    background:#43bd69;

    color:#fff;

    font-size:19px;

    font-weight:900;

    box-shadow:
    0 6px 0 #288b49;
}


/* ==============================
   PHONE
============================== */

@media(max-width:600px){

    .river{

        left:22%;

        width:59%;
    }

    .river-left-bank{

        left:13%;
        width:18%;
    }

    .river-left-grass{

        left:6%;
        width:18%;
    }

    .river-right-bank{

        right:10%;
        width:17%;
    }

    .river-right-grass{

        right:3%;
        width:16%;
    }

}


</style>
</head>


<body>


<div id="game">


<!-- =========================
     LAND / RIVER
========================= -->

<div class="river-left-bank"></div>

<div class="river-right-bank"></div>

<div class="river-left-grass"></div>

<div class="river-right-grass"></div>

<div class="river"></div>


<!-- WATER WAVES -->

<div class="wave wave1"></div>
<div class="wave wave2"></div>
<div class="wave wave3"></div>
<div class="wave wave4"></div>
<div class="wave wave5"></div>


<!-- DECORATION -->

<div class="rock rock1"></div>
<div class="rock rock2"></div>
<div class="rock rock3"></div>
<div class="rock rock4"></div>


<div class="bush bush1"></div>
<div class="bush bush2"></div>
<div class="bush bush3"></div>


<div class="flower flower1">🌼</div>
<div class="flower flower2">🌸</div>
<div class="flower flower3">🌻</div>


<!-- =========================
     TITLE
========================= -->

<div class="game-title">

🌟 Match the Character

</div>


<div class="score-box">

⭐

<span id="score">
0
</span>

/

<span id="total">
9
</span>

</div>



<!-- =========================
     BUCKETS
========================= -->

<div class="bucket-area">


<div
class="bucket bucket-red"
data-letter="A">

<div class="bucket-handle"></div>

<div class="bucket-rim"></div>

A

</div>



<div
class="bucket bucket-blue"
data-letter="B">

<div class="bucket-handle"></div>

<div class="bucket-rim"></div>

B

</div>



<div
class="bucket bucket-purple"
data-letter="C">

<div class="bucket-handle"></div>

<div class="bucket-rim"></div>

C

</div>


</div>



<!-- CORRECT -->

<div id="correctMessage">

Great! 🎉

</div>



<!-- FINISH -->

<div id="finish">

<div class="finish-card">

<div style="font-size:70px">

🏆

</div>

<h2>

Well Done!

</h2>

<p>

You matched all the characters!

</p>

<button onclick="startGame()">

Play Again

</button>

</div>

</div>


</div>



<script>

/* ==========================
   SETTINGS
========================== */

const letters = [

"A",
"B",
"C",

"A",
"B",
"C",

"A",
"B",
"C"

];


const game =
document.getElementById("game");


const scoreText =
document.getElementById("score");


const totalText =
document.getElementById("total");


const correctMessage =
document.getElementById("correctMessage");


const finish =
document.getElementById("finish");


let score = 0;


let dragging = null;


let offsetX = 0;

let offsetY = 0;


let oldX = 0;

let oldY = 0;



/* ==========================
   SOUND
========================== */

function playSound(correct){

try{

const audio =

new (
window.AudioContext ||
window.webkitAudioContext
)();


const oscillator =
audio.createOscillator();


const gain =
audio.createGain();


oscillator.connect(gain);

gain.connect(audio.destination);


oscillator.frequency.value =

correct
? 650
: 170;


gain.gain.value =
0.08;


oscillator.start();


if(correct){

oscillator.frequency
.exponentialRampToValueAtTime(

900,

audio.currentTime + .15

);

}

else{

oscillator.frequency
.exponentialRampToValueAtTime(

120,

audio.currentTime + .15

);

}


gain.gain
.exponentialRampToValueAtTime(

0.001,

audio.currentTime + .2

);


oscillator.stop(

audio.currentTime + .21

);


}

catch(e){}

}



/* ==========================
   START GAME
========================== */

function startGame(){


document
.querySelectorAll(".character")
.forEach(

item => item.remove()

);


finish.style.display =
"none";


score = 0;


scoreText.textContent =
"0";


totalText.textContent =
letters.length;



/* RANDOM ORDER */

const randomLetters =

[...letters]
.sort(

() => Math.random() - .5

);



/* ==========================
   MANUAL RIVER POSITIONS

   This keeps letters
   inside the river.
========================== */


const positions = [

[42,34],

[53,41],

[38,48],

[55,55],

[43,62],

[52,69],

[37,76],

[55,83],

[44,90]

];


randomLetters.forEach(

(letter,index) => {


const character =

document.createElement("div");


character.className =
"character";


character.textContent =
letter;


character.dataset.letter =
letter;



let pos =

positions[
index %
positions.length
];



/* little random movement */

let randomX =

(Math.random() * 5) - 2.5;


let randomY =

(Math.random() * 2) - 1;



character.style.left =

(pos[0] + randomX) + "%";


character.style.top =

(pos[1] + randomY) + "%";


character.addEventListener(

"pointerdown",

startDrag

);


game.appendChild(

character

);


});

}



/* ==========================
   START DRAG
========================== */

function startDrag(e){


e.preventDefault();


dragging =
e.currentTarget;


dragging
.setPointerCapture(

e.pointerId

);


const itemRect =

dragging
.getBoundingClientRect();


const gameRect =

game
.getBoundingClientRect();



offsetX =

e.clientX -
itemRect.left;


offsetY =

e.clientY -
itemRect.top;



oldX =

itemRect.left -
gameRect.left;


oldY =

itemRect.top -
gameRect.top;



/* convert percentage position
   to pixels */

dragging.style.left =

oldX + "px";


dragging.style.top =

oldY + "px";


dragging
.classList
.add("dragging");



dragging
.addEventListener(

"pointermove",

moveDrag

);


dragging
.addEventListener(

"pointerup",

endDrag

);


dragging
.addEventListener(

"pointercancel",

endDrag

);


}



/* ==========================
   MOVE WITH FINGER
========================== */

function moveDrag(e){


if(!dragging)
return;


const gameRect =

game
.getBoundingClientRect();



let x =

e.clientX -

gameRect.left -

offsetX;



let y =

e.clientY -

gameRect.top -

offsetY;



const width =

dragging.offsetWidth;


const height =

dragging.offsetHeight;



x =

Math.max(

0,

Math.min(

gameRect.width -
width,

x

)

);



y =

Math.max(

0,

Math.min(

gameRect.height -
height,

y

)

);



dragging.style.left =

x + "px";


dragging.style.top =

y + "px";


}



/* ==========================
   DROP
========================== */

function endDrag(e){


if(!dragging)
return;


const character =
dragging;


const charRect =

character
.getBoundingClientRect();



const centerX =

charRect.left +

charRect.width / 2;


const centerY =

charRect.top +

charRect.height / 2;



const buckets =

document
.querySelectorAll(".bucket");


let selectedBucket =
null;



buckets.forEach(

bucket => {


const rect =

bucket
.getBoundingClientRect();


if(

centerX >= rect.left &&

centerX <= rect.right &&

centerY >= rect.top &&

centerY <= rect.bottom

){

selectedBucket =
bucket;

}


});



character
.classList
.remove("dragging");



character
.removeEventListener(

"pointermove",

moveDrag

);


character
.removeEventListener(

"pointerup",

endDrag

);


character
.removeEventListener(

"pointercancel",

endDrag

);



/* ==========================
   CORRECT
========================== */

if(

selectedBucket &&

selectedBucket.dataset.letter ===

character.dataset.letter

){

playSound(true);


score++;


scoreText.textContent =
score;


character
.classList
.add("correct");



correctMessage
.classList
.add("show");



setTimeout(

()=>{

correctMessage
.classList
.remove("show");

},

500

);



setTimeout(

()=>{

character.remove();

},

250

);



/* ALL COMPLETE */

if(

score ===
letters.length

){

setTimeout(

()=>{

finish.style.display =
"flex";

},

650

);

}


}



/* ==========================
   WRONG
========================== */

else{


playSound(false);


character
.classList
.add("wrong");


character.style.left =

oldX + "px";


character.style.top =

oldY + "px";


setTimeout(

()=>{

character
.classList
.remove("wrong");

},

350

);


}


dragging = null;


}



/* ==========================
   START
========================== */

startGame();


</script>


</body>
</html>
